<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tenant Service Request | JCI Properties</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fb;
      margin: 0;
      padding: 40px 20px;
    }

    .form-container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      color: #446389;
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background: #446389;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #365173;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h1>Tenant Service Request</h1>

    <!-- FORM -->
    <form action="https://formsubmit.co/info@jciprop.com" method="POST">

      <label>Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone</label>
      <input type="tel" name="phone">

      <label>Issue</label>
      <textarea name="issue" rows="4" required></textarea>

      <label>Urgency</label>
      <select name="urgency" required>
        <option value="">Select urgency</option>
        <option>Low</option>
        <option>Medium</option>
        <option>Urgent</option>
        <option>Emergency</option>
      </select>

      <button type="submit">Submit Request</button>

    </form>
  </div>

</body>
</html>
